# Keeps build outputs (dist/ and the root landing page index.html) in sync
# with source automatically.
#
# Trigger: any push to main that touches a source input (bookmarklet.js,
# build.js, package.json, package-lock.json). Pushes that only change build
# outputs or docs are excluded, so the workflow never triggers itself.
#
# Behavior:
#   1. Run `npm run build` on a clean checkout.
#   2. Diff the rebuilt outputs against the just-pushed outputs.
#      - In sync? No commit, no push, no noise. (The dev rebuilt locally.)
#      - Drift? CI commits the rebuild on top of the dev's push.
#
# The follow-up commit includes "[skip ci]" so even if the path filter
# ever lets it through, it won't trigger a second run.

name: Build dist/

on:
  push:
    branches: [main]
    paths:
      - 'bookmarklet.js'
      - 'build.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit rebuilt outputs if they drifted
        run: |
          if git diff --quiet dist/ index.html; then
            echo "build outputs match source — nothing to commit."
          else
            echo "build outputs drifted from source. Committing rebuild."
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/ index.html
            git commit -m "ci: rebuild outputs [skip ci]"
            git push
          fi
