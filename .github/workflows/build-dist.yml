# Keeps dist/ in sync with source automatically.
#
# Trigger: any push to main that touches a source input (bookmarklet.js,
# build.js, package.json, package-lock.json). dist-only and README-only
# pushes are excluded, so the workflow never triggers itself.
#
# Behavior:
#   1. Run `npm run build` on a clean checkout.
#   2. Diff the rebuilt dist/ against the just-pushed dist/.
#      - In sync? No commit, no push, no noise. (The dev rebuilt locally.)
#      - Drift? CI commits the rebuilt dist/ on top of the dev's push.
#
# The follow-up commit includes "[skip ci]" so even if the path filter
# ever lets it through, it won't trigger a second run.

name: Build dist/

on:
  push:
    branches: [main]
    paths:
      - 'bookmarklet.js'
      - 'build.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit rebuilt dist/ if it drifted
        run: |
          if git diff --quiet dist/; then
            echo "dist/ matches source — nothing to commit."
          else
            echo "dist/ drifted from source. Committing rebuild."
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/
            git commit -m "ci: rebuild dist/ [skip ci]"
            git push
          fi
